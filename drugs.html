<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050507"><title>Chicago Gardens Drug Drops</title><style>
:root{--bg:#070709;--panel:#111118;--panel-border:#272731;--text:#fff;--purple:#a54cff;--purple-soft:#be74ff;--cyan:#29edff;--yellow:#ffe300;--sidebar:#08080b;--card-w:100px;--card-h:100px;--gap:10px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{font-family:"Trebuchet MS","Arial Narrow",Arial,sans-serif}button,select{font:inherit}
.site-layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:100vh}.sidebar{padding:30px 24px;background:var(--sidebar);border-right:1px solid #1c1c23}.sidebar-inner{position:sticky;top:24px;display:grid;gap:12px}
.nav-link{display:flex;align-items:center;justify-content:center;min-height:42px;padding:0 12px;text-decoration:none;border:2px solid var(--purple);border-radius:6px;background:#2a2337;color:var(--purple-soft);font-size:16px}.nav-link.active{background:#352748;box-shadow:0 0 14px rgba(165,76,255,.22)}
.content{min-width:0;padding:22px 28px 80px}.title{margin:0;text-align:center;color:var(--purple);font-size:36px;font-weight:400;letter-spacing:-1px}.randomizer,.tier-list{text-align:center}.randomizer{margin-top:22px}.section-title{margin:0;color:var(--purple);font-size:20px;font-weight:400}.divider{width:min(900px,100%);height:1px;margin:5px auto 0;background:#3c3c43}.subtitle{margin:3px 0 10px;color:var(--cyan);font-size:16px}
.controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;font-size:16px}select{min-width:140px;height:36px;padding:0 36px 0 12px;border:1px solid #464653;border-radius:5px;background:#252530;color:var(--yellow);outline:none}.spin-btn{min-width:74px;height:36px;border:2px solid var(--purple);border-radius:5px;background:#2a2932;color:var(--purple-soft);cursor:pointer}.spin-btn:disabled{opacity:.55;cursor:not-allowed}
.spinner{position:relative;width:min(900px,100%);height:182px;margin:0 auto;overflow:hidden;border:1px solid var(--panel-border);border-radius:14px;background:radial-gradient(circle at 50% 125%,rgba(64,58,98,.22),transparent 58%),var(--panel);box-shadow:0 15px 30px rgba(0,0,0,.34)}.reel{position:absolute;left:0;top:40px;display:flex;gap:var(--gap);width:max-content;will-change:transform}.reel-card{flex:0 0 var(--card-w);width:var(--card-w);height:var(--card-h);overflow:hidden;border-radius:9px;background:#18181e}.reel-card img,.drop-card img,.tier-image img{display:block;width:100%;height:100%;object-fit:cover}
.picker{position:absolute;z-index:5;left:50%;top:28px;width:3px;height:124px;transform:translateX(-50%);background:var(--yellow);box-shadow:0 0 8px rgba(255,227,0,.6)}.fade{position:absolute;z-index:4;top:0;bottom:0;width:70px;pointer-events:none}.fade.left{left:0;background:linear-gradient(90deg,#111118 4%,rgba(17,17,24,0))}.fade.right{right:0;background:linear-gradient(270deg,#111118 4%,rgba(17,17,24,0))}
.drops-heading{margin:12px 0 10px;color:var(--yellow);font-size:16px;font-weight:400}.drops{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;min-height:124px}.drop-card{position:relative;width:122px;height:122px;overflow:hidden;border:2px solid #4deeff;border-radius:11px;background:#121218;box-shadow:0 0 12px rgba(77,238,255,.36)}.drop-name{position:absolute;z-index:2;top:5px;left:5px;right:5px;overflow:hidden;padding:3px 5px;border:1px solid rgba(255,255,255,.32);border-radius:5px;background:rgba(8,8,11,.72);color:#fff;font-size:11px;white-space:nowrap;text-overflow:ellipsis;text-align:left}
.tier-list{margin-top:48px}.tier-list>h2{margin:0;color:var(--purple);font-size:22px;font-weight:400}.tier-block{margin-top:32px}.tier-block h3{margin:0 0 14px;font-size:19px;font-weight:400}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:18px 12px}.tier-card{min-width:0}.tier-image{width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:10px;background:#15151b}.tier-name{margin-top:7px;overflow:hidden;color:#f1f1f4;font-size:11px;white-space:nowrap;text-overflow:ellipsis}
@media(max-width:850px){.site-layout{grid-template-columns:1fr}.sidebar{padding:14px;border-right:0;border-bottom:1px solid #1c1c23}.sidebar-inner{position:static;grid-template-columns:1fr 1fr}.content{padding:18px 12px 60px}.title{font-size:28px}}
@media(max-width:520px){:root{--card-w:84px;--card-h:84px;--gap:8px}.spinner{height:160px}.reel{top:37px}.picker{top:25px;height:110px}.fade{width:34px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.drop-card{width:104px;height:104px}}
</style></head>
<body>
<div class="site-layout">
<aside class="sidebar"><div class="sidebar-inner"><a class="nav-link " href="index.html">Faction Drop</a><a class="nav-link active" href="drugs.html">Drug Drop</a></div></aside>
<main class="content">
<h1 class="title">Chicago Gardens Drug Drops</h1>
<section class="randomizer">
<h2 class="section-title">Randomize</h2><div class="divider"></div><p class="subtitle">Simulate a drug drop spin</p>
<div class="controls"><label for="tierSelect">Choose Tier:</label><select id="tierSelect"></select><button class="spin-btn" id="spinButton" type="button">Spin</button></div>
<div class="spinner" id="spinner"><div class="fade left"></div><div class="fade right"></div><div class="reel" id="reel"></div><div class="picker"></div></div>
<h3 class="drops-heading">Your drops</h3><div class="drops" id="drops"></div>
</section>
<section class="tier-list"><h2>Drug Tiers</h2><div class="divider"></div><p class="subtitle">Chicago Gardens product rarity list</p><div id="tierList"></div></section>
</main></div>
<script>const PAGE_DATA={"tiers": {"Tier 1": {"ids": ["apple-pie", "twix-mudslide", "frosted-flakes", "rasprilla", "sprinkzz-lucky-charms"], "count": 4}, "Tier 1.5": {"ids": ["apple-pie", "twix-mudslide", "frosted-flakes", "rasprilla", "sprinkzz-lucky-charms"], "count": 4}, "Tier 2": {"ids": ["twix-mudslide", "box", "frosted-flakes", "sprinkzz-lucky-charms", "visa-8oz", "whole-thang-gr", "whole-thang-wh"], "count": 6}}, "items": [{"id": "apple-pie", "name": "Apple Pie", "image": "apple-pie.webp", "stars": 1}, {"id": "twix-mudslide", "name": "Twix Mudslide", "image": "twix-mudslide.webp", "stars": 2}, {"id": "box", "name": "Box", "image": "box.webp", "stars": 4}, {"id": "frosted-flakes", "name": "Frosted Flakes", "image": "frosted-flakes.webp", "stars": 2}, {"id": "rasprilla", "name": "Rasprilla", "image": "rasprilla.webp", "stars": 1}, {"id": "sprinkzz-lucky-charms", "name": "Sprinkzz Lucky Charms", "image": "sprinkzz-lucky-charms.webp", "stars": 2}, {"id": "visa-8oz", "name": "Visa 8oz", "image": "visa-8oz.webp", "stars": 4}, {"id": "whole-thang-gr", "name": "Whole Thang GR", "image": "whole-thang-gr.webp", "stars": 4}, {"id": "whole-thang-wh", "name": "Whole Thang WH", "image": "whole-thang-wh.webp", "stars": 4}], "settings": {"spinDurationMs": 2100, "pauseBetweenRollsMs": 180}};
function randomItem(items){return items[Math.floor(Math.random()*items.length)]}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function populateSelect(select,configMap,preferred){select.replaceChildren();Object.keys(configMap).forEach(name=>{const opt=document.createElement("option");opt.value=name;opt.textContent=name;select.appendChild(opt)});if(preferred&&configMap[preferred])select.value=preferred}
function makeReelCard(item){const card=document.createElement("div");card.className="reel-card";const img=document.createElement("img");img.src=item.image;img.alt=item.name;img.draggable=false;card.appendChild(img);return card}
function makeDropCard(item){const card=document.createElement("div");card.className="drop-card";const img=document.createElement("img");img.src=item.image;img.alt=item.name;img.draggable=false;const name=document.createElement("div");name.className="drop-name";name.textContent=item.name;card.append(img,name);return card}
function setupSpinner({selectId,spinId,spinnerId,reelId,dropsId,configMap,itemMap,preferred,settings}){const select=document.getElementById(selectId),spinBtn=document.getElementById(spinId),spinner=document.getElementById(spinnerId),reel=document.getElementById(reelId),drops=document.getElementById(dropsId);let spinning=false;
function pool(){const cfg=configMap[select.value];return cfg?cfg.ids.map(id=>itemMap.get(id)).filter(Boolean):[]}
function centerIdle(){if(spinning)return;const items=pool();reel.style.transition="none";reel.replaceChildren();if(!items.length)return;const seq=[];for(let i=0;i<14;i++)seq.push(items[i%items.length]);seq.forEach(item=>reel.appendChild(makeReelCard(item)));requestAnimationFrame(()=>{const first=reel.querySelector(".reel-card");if(!first)return;const w=first.getBoundingClientRect().width,gap=parseFloat(getComputedStyle(reel).gap)||0,step=w+gap,index=Math.min(4,seq.length-1);reel.style.transform=`translateX(${spinner.clientWidth/2-(index*step+w/2)}px)`})}
async function rollOnce(items){const total=58,winnerIndex=total-7,winner=randomItem(items),seq=Array.from({length:total},()=>randomItem(items));seq[winnerIndex]=winner;reel.style.transition="none";reel.style.transform="translateX(0px)";reel.replaceChildren(...seq.map(makeReelCard));await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));const first=reel.querySelector(".reel-card"),w=first.getBoundingClientRect().width,gap=parseFloat(getComputedStyle(reel).gap)||0,step=w+gap,jitter=(Math.random()-.5)*w*.42,x=spinner.clientWidth/2-(winnerIndex*step+w/2)+jitter;reel.style.transition=`transform ${settings.spinDurationMs}ms cubic-bezier(.08,.64,.06,1)`;reel.style.transform=`translateX(${x}px)`;await wait(settings.spinDurationMs+80);return winner}
async function spin(){if(spinning)return;const cfg=configMap[select.value],items=pool();if(!cfg||!items.length)return;spinning=true;spinBtn.disabled=true;select.disabled=true;drops.replaceChildren();try{for(let i=0;i<cfg.count;i++){const winner=await rollOnce(items);drops.appendChild(makeDropCard(winner));if(i<cfg.count-1)await wait(settings.pauseBetweenRollsMs)}}finally{spinning=false;spinBtn.disabled=false;select.disabled=false}}
populateSelect(select,configMap,preferred);select.addEventListener("change",centerIdle);spinBtn.addEventListener("click",spin);window.addEventListener("resize",centerIdle);centerIdle()}
function renderTiers(containerId,items,groups){const root=document.getElementById(containerId);root.replaceChildren();groups.forEach(group=>{const list=items.filter(item=>item.stars===group.stars);if(!list.length)return;const block=document.createElement("section");block.className="tier-block";const h3=document.createElement("h3");h3.textContent=group.title;const grid=document.createElement("div");grid.className="grid";list.forEach(item=>{const card=document.createElement("article");card.className="tier-card";card.title=item.name;const imageWrap=document.createElement("div");imageWrap.className="tier-image";const img=document.createElement("img");img.src=item.image;img.alt=item.name;img.draggable=false;const name=document.createElement("div");name.className="tier-name";name.textContent=item.name;imageWrap.appendChild(img);card.append(imageWrap,name);grid.appendChild(card)});block.append(h3,grid);root.appendChild(block)})}

const itemMap=new Map(PAGE_DATA.items.map(item=>[item.id,item]));
setupSpinner({selectId:"tierSelect",spinId:"spinButton",spinnerId:"spinner",reelId:"reel",dropsId:"drops",configMap:PAGE_DATA.tiers,itemMap,preferred:"Tier 1",settings:PAGE_DATA.settings});
renderTiers("tierList",PAGE_DATA.items,[{stars:1,title:"1 Leaf Products"},{stars:2,title:"2 Leaf Products"},{stars:3,title:"3 Leaf Products"},{stars:4,title:"4 Leaf Products"}]);
</script>
</body></html>
